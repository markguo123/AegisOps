# Production defaults. Set a published immutable image version before installation.
mode: standard # standard (Web + Backend) or minimal (embedded SPA)
image:
  repository: ghcr.io/markguo123/aegisops
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
web:
  repository: ghcr.io/markguo123/aegisops-web
  tag: "" # defaults to the backend tag
  digest: ""
imagePullSecrets: []
database:
  driver: mysql # mysql or sqlite
  sqlitePath: /data/aegisops.db
  existingSecret: "" # required for mysql; key: dsn (must include parseTime=true)
  migrationSecret: "" # optional DDL-capable Secret (dsn); runtime Secret may use only DML
migration:
  mode: auto # auto: MySQL Job / SQLite init; external: schema check only
  timeoutSeconds: 900
adoption:
  scriptManaged: false # one-time manual migration only; existing credentials/data required
persistence:
  enabled: true
  existingClaim: "" # bring-your-own claim for /data (aegisops-data); reports stays managed here
  existingReportsClaim: ""
  storageClass: "" # cluster default
  # Backward-compatible fallback for both volumes below (legacy single "size" key).
  size: 5Gi
  dataSize: "" # empty = size; /data capacity (sessions/audit/sqlite/blobs)
  reportsSize: "" # empty = size; /reports capacity
credentials:
  existingSecret: "" # keys: key (64 hex chars), password; otherwise generated once
server:
  publicURL: "" # HTTPS root URL when behind a TLS proxy
  allowQuickstartHTTP: false # explicit experience-only HTTP opt-in
  allowLoopbackHTTP: false
blobs:
  driver: s3 # production: s3; db/dir/off are explicit alternatives
  existingSecret: "" # optional envFrom Secret with AEGISOPS_PLATFORM_BLOBS_* keys
service:
  type: ClusterIP
  nodePort: null
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
writeAccess: false
auth:
  adminUsername: admin
  oidcDisablePKCE: false
  oidcAllowMissingNonce: false
  oidcCASecret: "" # optional Secret with ca.crt
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
