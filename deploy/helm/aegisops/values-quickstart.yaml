# 体验预设（install.sh --profile=quickstart 默认套用）。
# 仅用于快速体验，不要用于生产：SQLite + 本地文件 + NodePort HTTP 登录。
mode: minimal

database:
  # 体验使用内嵌 SQLite
  driver: sqlite

blobs:
  # 体验使用本地目录保存附件。dir 驱动必须显式给出根目录：
  # 留空会让 server 在构造对象存储时直接拒启（dir backend needs platform.blobs.dir）。
  # /data 在 Chart 里是 PVC（persistence.enabled=true 时），容器内可写。
  driver: dir
  dir: /data/blobs

server:
  # 体验模式显式允许 HTTP 登录（生产禁止）
  allowQuickstartHTTP: true

service:
  # 体验入口使用 NodePort
  type: NodePort
