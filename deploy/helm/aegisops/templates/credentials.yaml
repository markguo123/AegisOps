{{- if not .Values.credentials.existingSecret -}}
{{- $name := include "aegisops.credentials" . -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and .Release.IsUpgrade (not $old) }}{{ fail "credential Secret missing on upgrade; restore it or provide credentials.existingSecret" }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $old }}
  key: {{ required "existing credential Secret lacks key" (get $old.data "key") | quote }}
  password: {{ required "existing credential Secret lacks password" (get $old.data "password") | quote }}
  {{- else }}
  key: {{ randBytes 32 | b64dec | sha256sum | b64enc | quote }}
  password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
