apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegisops.name" . }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "aegisops.name" . }}-readonly
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    # LimitRange / ResourceQuota / ServiceAccount / ReplicationController 是排障时
    # kubectl describe/get all 会访问的核心资源；只读，不提供任何身份或配额修改能力。
    resources: [namespaces, pods, nodes, services, endpoints, events, configmaps, serviceaccounts, limitranges, resourcequotas, replicationcontrollers, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    # secrets 仅用于元数据/键级读取（ListSecretMeta），内容值永不出采集边界
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    # kubectl get apiservices / describe node 的健康排查需要看聚合 API 可用性。
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    # get_node_usage 使用 nodes；kubectl top pods 使用 pods。metrics API 只支持 get/list。
    resources: [nodes, pods]
    verbs: [get, list]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "aegisops.name" . }}-readonly
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "aegisops.name" . }}-readonly
subjects:
  - {kind: ServiceAccount, name: {{ include "aegisops.name" . }}, namespace: {{ .Release.Namespace }}}

{{ if .Values.writeAccess }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "aegisops.name" . }}-write
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    # kubectl scale / autoscale 会读写 scale 子资源，不能只给父资源授权。
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "endpoints", "events", "namespaces", "nodes", "serviceaccounts", "limitranges", "resourcequotas", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "namespaces", "serviceaccounts", "limitranges", "resourcequotas", "persistentvolumeclaims"]
    # create/patch/update 供三期创建通道（SSA）使用；delete 仅供二期修复操作
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["patch", "update", "delete"]
  - apiGroups: [""]
    # 仅非交互 exec；客户端/服务端仍硬拒 -i/-t、attach 与 port-forward。
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    # kubectl cordon/uncordon/taint 修改 Node 的 spec，不走子资源。
    resources: ["nodes"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    # Secret 只创建/覆盖，永不读取内容值（AGENTS.md LLM Safety / SECURITY.md §3）
    resources: ["secrets"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    # namespaced RBAC 可随 create_resource / kubectl 修复走审批；cluster-scoped RBAC
    # 刻意不在此默认示例中开放，避免一次误批直接产生提权链。
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "aegisops.name" . }}-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "aegisops.name" . }}-write
subjects:
  - {kind: ServiceAccount, name: {{ include "aegisops.name" . }}, namespace: {{ .Release.Namespace }}}
{{ end }}
