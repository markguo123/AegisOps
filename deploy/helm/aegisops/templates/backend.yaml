{{- $name := include "aegisops.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-server
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: server}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: migrate
          image: {{ include "aegisops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [db, migrate, --config, /etc/aegisops/config.yaml]
          {{- if eq .Values.database.driver "mysql" }}
          env:
            - name: AEGISOPS_PLATFORM_STORE_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: dsn}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/aegisops, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: aegisops
          image: {{ include "aegisops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server, --config, /etc/aegisops/config.yaml, --addr, ":8080"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: AEGISOPS_ENC_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "aegisops.credentials" . }}, key: key}
            - name: AEGISOPS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "aegisops.credentials" . }}, key: password}
            {{- if eq .Values.database.driver "mysql" }}
            - name: AEGISOPS_PLATFORM_STORE_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: dsn}
            {{- end }}
          {{- if .Values.blobs.existingSecret }}
          envFrom:
            - secretRef: {name: {{ .Values.blobs.existingSecret }}}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/aegisops, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: reports, mountPath: /reports}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/aegisops}
      volumes:
        - name: config
          configMap: {name: {{ $name }}-config}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" $name) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: reports
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-server
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
spec:
  type: {{ if eq .Values.mode "minimal" }}{{ .Values.service.type }}{{ else }}ClusterIP{{ end }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, component: server}
  ports:
    - port: 8080
      targetPort: http
      {{- if and (eq .Values.mode "minimal") (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
