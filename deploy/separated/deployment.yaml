# 平台主进程 Deployment —— 形态 B「前后端分离」的后端（纯 API，P6.2 / D-26）。
#
# 与 deploy/allinone/deployment.yaml 的唯一差异：容器多一条环境变量
# AEGISOPS_PLATFORM_SERVER_STATIC_ENABLED=false，即关闭内嵌 SPA 静态托管，本进程只提供
# /api/v1（含 Chat SSE）与 /healthz /readyz /version，页面交给同目录
# web-deployment.yaml 的 Nginx（站点配置 deploy/separated/nginx.conf 托管 web/dist）。
# 其余字段必须与形态 A 逐字一致，由 tests/arch/deploy_manifest_test.go 断言，防止两套
# 清单各自漂移。两形态的 Deployment 同名（aegisops-server），只能二选一 apply。
#
# 单副本与 Recreate 的理由、探针语义、镜像档位（默认档内置 bash/jq/kubectl，无 shell 变体
# 见 Dockerfile.distroless）等通用口径见 deploy/allinone/deployment.yaml 与部署手册，
# 本文件不重复说明。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-server
  namespace: aegisops
  labels:
    app: aegisops
    component: server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aegisops
      component: server
  template:
    metadata:
      labels:
        app: aegisops
        component: server
    spec:
      serviceAccountName: aegisops
      # 平台要用自身身份访问本集群 API（集群端点默认走 in-cluster 配置）。
      automountServiceAccountToken: true
      containers:
        - name: aegisops
          # 镜像地址由部署方提供（deploy/install.sh 的 IMAGE/TAG 参数）；
          # 清单里不写私有仓库地址这类环境专有值。
          image: aegisops:latest
          args: ["server", "--config", "/etc/aegisops/config.yaml", "--addr", ":8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # 存储 DSN（含数据库口令）：只走 Secret，ConfigMap 里的 dsn 恒为空。
            - name: AEGISOPS_PLATFORM_STORE_DSN
              valueFrom:
                secretKeyRef: { name: aegisops-store, key: dsn }
            # 凭据加密密钥：kubeconfig / 配置中心敏感键的落库加密主密钥。
            - name: AEGISOPS_ENC_KEY
              valueFrom:
                secretKeyRef: { name: aegisops-enc, key: key }
            # 首启管理员口令：仅空库首启必需，初始化完成后可以摘掉。
            - name: AEGISOPS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: aegisops-admin, key: password, optional: true }
            # 模型密钥（密钥态，env 恒优先）。其余动态键（模型地址/模型名/审批策略等）
            # 一律由配置中心页面写入 DB settings，不在清单里注入；
            # 非敏感部署期种子值见 deploy/example/env-overrides.example.yaml。
            - name: AEGISOPS_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: aegisops-llm, key: api_key, optional: true }
            # 形态 B 的唯一差异：关掉内嵌 SPA 静态托管，本进程只提供 API（D-26）。
            # 键名契约由 internal/config/platform_server_test.go 锁定，改键名会被测试挡住。
            - name: AEGISOPS_PLATFORM_SERVER_STATIC_ENABLED
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /etc/aegisops
              readOnly: true
            # 可写区：/data 会话与审计落盘、/reports 报告导出。业务数据的权威存储是
            # MySQL，二进制对象落在对象存储后端。/data 挂在 PVC aegisops-data 上、/reports
            # 挂在 PVC aegisops-reports 上：两块各自独立的 RWO PVC（不能共用同一 Claim，
            # 否则 kubelet 对同一卷第二次 NodePublish 会挂起，Pod 卡 ContainerCreating）。
            # 两块卷同随 PERSIST_REPORTS 总开关创建/关闭（install.sh 渲染 base/pvc.yaml）：
            #   true  → 两块都挂 PVC（生产默认）
            #   false → 两个 PVC 都不建，/data 与 /reports 一起退化 emptyDir（预览/快速起）
            # 什么时候必须持久化看三态：
            #   platform.store.driver=sqlite    → PVC 必需（平台库文件本身就在 /data）
            #   platform.blobs.driver=dir       → PVC 必需（对象只有 /data/blobs 这一份副本，
            #                                     Pod 重建即丢内容，登记表只剩 missing 行）
            #   platform.blobs.driver=s3 / db   → driver=s3 仅报告可选：对象在桶里、db 在库里，
            #                                     只有 report.directory 的兼容副本值得留卷
            # /tmp 还兼作 driver=s3 的上传中转目录（platform.blobs.tmp_dir），必须保持可写。
            - name: data
              mountPath: /data
            - name: reports
              mountPath: /reports
            - name: tmp
              mountPath: /tmp
            # 镜像 ENV HOME=/home/aegisops：kubectl 把服务发现缓存写在 $HOME/.kube。
            # 只读根文件系统下这个目录不挂可写卷，kubectl 会在运行期报缓存写入失败。
            - name: home
              mountPath: /home/aegisops
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: config
          configMap:
            name: aegisops-config
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: aegisops-data
        - name: reports
          persistentVolumeClaim:
            claimName: aegisops-reports
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
