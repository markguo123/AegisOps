# 把后端 /reports 的临时卷换成独立 reports PVC（P6.5：报告与导出跨重启保留）。
#
# 本文件是 strategic merge patch，不是可 apply 的清单（刻意不写 apiVersion/kind）：
# 只能用 kubectl patch --patch-file，`kubectl apply -R -f deploy/` 会在它这里报校验错误。
#
# 先 apply deploy/base/pvc.yaml（storageClassName 留注释即用集群默认存储类，要指定就改成现场值），再执行：
#   kubectl -n aegisops patch deploy aegisops-server --type=strategic \
#     --patch-file deploy/example/deployment-reports-pvc.yaml
#
# emptyDir 显式置空是必需的：同一个卷同时带 emptyDir 与 persistentVolumeClaim
# 会被 API 校验拒绝。
#
# 什么时候真的需要：报告/导出要留档。SQLite 兜底存储时本文件不是必需——后端 Deployment
# 的 /data 已默认落在数据 PVC（aegisops-data）上，库文件/会话/审计自然被持久化；
# 本文件只管把 /reports 也从 emptyDir 换到独立的报告 PVC（aegisops-reports）上。
# 两份 Claim 相互独立、各自 RWO，分别管理容量与生命周期。
spec:
  template:
    spec:
      volumes:
        - name: reports
          emptyDir: null
          persistentVolumeClaim:
            claimName: aegisops-reports
